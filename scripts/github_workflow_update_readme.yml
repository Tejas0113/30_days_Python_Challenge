name: Auto Update 30 Days Challenge Tracker

on:
  push:
    branches:
      - main
    paths:
      - 'days/**'
      - 'day*.py'
      - 'scripts/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 🔄 Run Tracker Auto-Update
        run: |
          python scripts/update_tracker.py

      - name: 🚀 Commit & Push Updates
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet README.md; then
            git add README.md
            git commit -m "docs(tracker): auto-update 30 days challenge progress [skip ci]"
            git push
          else
            echo "No README changes detected. Everything is up to date!"
          fi
